services:
  notification_service:
    build:
      context: .
      target: dev

    container_name: notification_service
    init: true
    ports:
      - "3002:3000"
      
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    env_file:
      - .env
    command: pnpm start:dev
    networks:
      - poc_network

volumes:
  api_node_modules:

networks:
  poc_network:
    external: true
