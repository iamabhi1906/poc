services:
  order_service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: order_service
    init: true
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    env_file:
      - .env
    command: pnpm start:dev
    networks:
      - poc_network

volumes:
  api_node_modules:

networks:
  poc_network:
    external: true
